<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RemakeFace Studio · 管理入口</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e14'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='800' fill='%234da3ff' text-anchor='middle'%3ERF%3C/text%3E%3C/svg%3E">
<style>
/* HaizhuDesignSkill — Dark AI workspace 登录门 */
:root{
  --bg:#0a0e14; --surface:#11161f; --surface-2:#161d29;
  --border:#1e2632; --border-strong:#2a3547;
  --text:#e6edf3; --muted:#8b98a9; --dim:#5c6a7d;
  --accent:#4da3ff; --accent-soft:rgba(77,163,255,.14); --accent-line:rgba(77,163,255,.4);
  --danger:#e5484d;
  --font-ui:'Inter','SF Pro Text',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
body{
  font:14px/1.6 var(--font-ui);
  color:var(--text);
  background:
    radial-gradient(600px 300px at 85% -10%, rgba(77,163,255,.06), transparent 60%),
    radial-gradient(500px 300px at -10% 110%, rgba(63,182,139,.04), transparent 60%),
    var(--bg);
  min-height:100vh;display:grid;place-items:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.door{width:min(400px,100%)}
.card{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;
  padding:40px 34px 32px;box-shadow:0 16px 50px rgba(0,0,0,.45);
}
.brand{display:flex;align-items:center;gap:.65rem;margin-bottom:6px}
.logo{
  width:2.1rem;height:2.1rem;display:grid;place-items:center;flex:0 0 auto;
  border-radius:6px;background:var(--bg);border:1px solid var(--border-strong);
  color:var(--accent);font:800 12px/1 var(--font-mono);letter-spacing:.5px;
}
.brand .mark{font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.brand .pro{font:600 10px var(--font-mono);color:var(--accent);border:1px solid var(--accent-line);
  background:var(--accent-soft);padding:1px 6px;border-radius:4px;letter-spacing:1px}
.sub{font-size:12px;color:var(--muted);margin-bottom:30px;
  padding-bottom:16px;border-bottom:1px solid var(--border)}
form{display:flex;flex-direction:column;gap:8px}
label{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
input{
  width:100%;padding:12px 14px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);font-size:14px;font-family:var(--font-mono);
  outline:none;transition:border-color .15s;
}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--accent-line)}
button{
  margin-top:14px;background:var(--accent);color:#061225;border:0;border-radius:8px;
  padding:13px;font-size:14px;font-weight:600;cursor:pointer;
  transition:background .15s,transform .1s;
}
button:hover:not(:disabled){background:#6cb6ff}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.5;cursor:wait}
#err{min-height:20px;margin-top:12px;font:12px var(--font-mono);color:var(--danger)}
.hint{font:11px var(--font-mono);color:var(--dim);margin-top:14px}
.foot{margin-top:20px;font:10px var(--font-mono);color:var(--dim);text-align:center;letter-spacing:1px}
@media (max-width:480px){.card{padding:32px 24px 26px}}
</style>
</head>
<body>
<body>
<div class="door">
  <div class="card">
    <div class="brand">
      <div class="logo">RF</div>
      <span class="mark">RemakeFace Studio</span>
      <span class="pro">PRO</span>
    </div>
    <div class="sub">Image Generation Workstation · Admin Gate</div>
    <form id="f" autocomplete="off">
      <label for="pw">管理员密码</label>
      <input id="pw" type="password" placeholder="••••••••" autofocus autocomplete="current-password">
      <button id="btn" type="submit">进入工作站</button>
    </form>
    <div id="err" role="alert" aria-live="polite"></div>
    <div class="hint">默认密码见 .env / start.sh · ADMIN_PASSWORD</div>
  </div>
  <div class="foot">RF/PRO · gateway v2 · admin session</div>
</div>
<script>
const $=s=>document.querySelector(s);
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("#btn"),err=$("#err");
  btn.disabled=true;err.textContent="";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:$("#pw").value})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||"密码错误");
    location.href="/";
  }catch(x){err.textContent="✕ "+x.message;btn.disabled=false;$("#pw").select();}
});
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#f").requestSubmit()});
</script>
</body>
</html>
